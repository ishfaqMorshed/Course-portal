# Supabase project config. Linked project ref is set via `supabase link`.
project_id = "xbeuuibbllcvyovpmpak"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
# Where magic-link / OTP redirects land. Override per-env with PORTAL_BASE_URL.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
# Magic-link email OTP
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.wh-purchase-47]
# Inbound GHL webhook — verifies a shared secret header itself, so no Supabase JWT required.
verify_jwt = false
